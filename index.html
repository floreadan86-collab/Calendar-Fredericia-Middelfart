<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calendar Ortodox 2026 - Parohia Ortodoxă Română Fredericia-Middelfart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f8f6f1;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #333;
    }

    .calendar-page {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .calendar-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .calendar-header h1 {
      margin: 0 0 8px;
      font-size: 32px;
      color: #765b2f;
    }

    .calendar-header p {
      margin: 0;
      color: #666;
      font-size: 15px;
    }

    .calendar-box {
      width: 100%;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .calendar-box iframe {
      display: block;
      width: 100%;
      height: 1600px;
      border: 0;
    }

    .calendar-footer {
      text-align: center;
      padding: 18px 10px;
      font-size: 13px;
      color: #777;
    }

    .calendar-footer a {
      color: #765b2f;
      text-decoration: none;
    }

    @media (max-width: 700px) {

      .calendar-page {
        padding: 8px;
      }

      .calendar-header h1 {
        font-size: 24px;
      }

      .calendar-header p {
        font-size: 13px;
      }

      .calendar-box {
        border-radius: 8px;
      }

      .calendar-box iframe {
        height: 1800px;
      }
    }
  </style>
</head>

<body>

  <main class="calendar-page">

    <header class="calendar-header">
      <h1>Calendar Ortodox 2026</h1>
      <p>
        Parohia Ortodoxă Română Fredericia-Middelfart, Danemarca
      </p>
    </header>

    <section class="calendar-box">

      <iframe
        src="https://calendar.patriarhia.ro/"
        title="Calendar Creștin Ortodox 2026 - Patriarhia Română"
        loading="lazy">
      </iframe>

    </section>

    <footer class="calendar-footer">
      Calendarul este furnizat de
      <a
        href="https://calendar.patriarhia.ro/"
        target="_blank"
        rel="noopener noreferrer">
        Calendarul Patriarhiei Române
      </a>.
    </footer>

  </main>
<script>
(function () {
  const translations = {
    ro: {
      title: "Calendar Ortodox 2026",
      parish: "Parohia Ortodoxă Română Fredericia-Middelfart, Danemarca",
      source: "Calendarul este furnizat de",
      link: "Calendarul Patriarhiei Române"
    },
    da: {
      title: "Ortodoks kalender 2026",
      parish: "Den rumænsk-ortodokse menighed i Fredericia-Middelfart, Danmark",
      source: "Kalenderen leveres af",
      link: "Den rumænske patriarkats kalender"
    },
    en: {
      title: "Orthodox Calendar 2026",
      parish: "Romanian Orthodox Parish of Fredericia-Middelfart, Denmark",
      source: "Calendar provided by",
      link: "The Romanian Patriarchate's Calendar"
    }
  };

  const params = new URLSearchParams(window.location.search);
  const requested = (params.get("lang") || "").toLowerCase();
  const lang = requested.startsWith("da") ? "da"
             : requested.startsWith("en") ? "en" : "ro";
  const t = translations[lang];

  document.documentElement.lang = lang;
  const heading = document.querySelector(".calendar-header h1");
  const parish = document.querySelector(".calendar-header p");
  const footer = document.querySelector(".calendar-footer");
  if (heading) heading.textContent = t.title;
  if (parish) parish.textContent = t.parish;
  if (footer) {
    const link = footer.querySelector("a");
    if (link) {
      link.textContent = t.link;
      footer.replaceChildren(document.createTextNode(t.source + " "), link);
    }
  }
  document.title = t.title + " - " + t.parish;
})();
</script>
</body>
</html>
